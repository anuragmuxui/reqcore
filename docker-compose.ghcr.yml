services:
  db:
    image: postgres:16-alpine
    container_name: reqcore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reqcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reqcore}
      POSTGRES_DB: ${POSTGRES_DB:-reqcore}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reqcore} -d ${POSTGRES_DB:-reqcore}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - reqcore_postgres_data:/var/lib/postgresql/data

  app:
    image: ghcr.io/anuragmuxui/reqcore:latest
    container_name: reqcore_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reqcore}:${POSTGRES_PASSWORD:-reqcore}@db:5432/${POSTGRES_DB:-reqcore}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-only-change-this-secret-1234567890}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-reqcore}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      REQCORE_RUN_MIGRATIONS_ON_START: ${REQCORE_RUN_MIGRATIONS_ON_START:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  reqcore_postgres_data:
